<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tajweed reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:wght@400;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"KFGQPC Hafs";src:url("https://cdn.jsdelivr.net/npm/kfgqpc-uthmanic-script-hafs-regular@1.0.0/arabic.otf") format("opentype");font-weight:normal;font-style:normal;font-display:swap}
:root{--rule:#DCD6C6;--ink:#1B1A17;--paper:#FDFCF8;--gold:#B08C3A;--hl:#FFF3CE;--bar:64px;--ar-base:25px;--scale:1;--ar:calc(var(--ar-base) * var(--scale))}
*{box-sizing:border-box}
body{margin:0;background:#EDEAE1;font-family:"Work Sans",system-ui,sans-serif;color:var(--ink)}

.bar{position:sticky;top:0;z-index:20;background:#12312A;color:#EDE8DA;padding:13px 22px;
  display:flex;gap:20px;align-items:center;flex-wrap:wrap;font-size:15.5px}
.bar-brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:#EDE8DA;flex-shrink:0}
.bar-brand-name{font-family:Amiri,serif;font-size:19px;font-weight:700;line-height:1.05;white-space:nowrap}
.bar-brand-name span{display:block;font-family:"Work Sans",sans-serif;font-size:10px;font-weight:500;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.bar input[type=checkbox]{width:15px;height:15px}
.bar label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap}
.bar .sp{flex:1}
.nav{display:flex;gap:8px;align-items:center}
.bar select{
  background:#1B4A3E;color:#EDE8DA;border:1px solid rgba(224,206,147,.35);
  border-radius:4px;padding:7px 10px;font:inherit;font-size:15px;cursor:pointer;
  max-width:250px;
}
.bar select:focus{outline:2px solid var(--gold);outline-offset:1px}
.here{font-size:14.5px;color:#9FB3A9;white-space:nowrap}
.credit{
  margin-left:auto;align-self:flex-end;
  font-size:12.5px;color:#3E7361;text-decoration:none;white-space:nowrap;
  transition:color .15s ease;
}
.credit:hover{color:#7FA394}

/* small ? that explains a toggle */
.hint{
  display:inline-flex;align-items:center;justify-content:center;
  width:17px;height:17px;border-radius:50%;flex:0 0 17px;
  border:1px solid rgba(224,206,147,.55);color:#E4CE93;
  font-size:11.5px;font-weight:600;cursor:help;position:relative;margin-left:-12px;
}
.hint:hover,.hint:focus{background:rgba(224,206,147,.16);outline:none}
.hint::after{
  content:attr(data-tip);position:absolute;top:26px;left:50%;
  transform:translateX(-50%) translateY(-4px);
  width:290px;background:#0B211C;color:#DCD8CB;
  border:1px solid rgba(224,206,147,.3);border-radius:5px;
  padding:10px 12px;font-size:13px;font-weight:400;line-height:1.5;
  text-align:left;white-space:normal;letter-spacing:0;
  opacity:0;visibility:hidden;transition:opacity .14s ease, transform .14s ease;
  box-shadow:0 6px 20px rgba(0,0,0,.3);z-index:30;
}
.hint:hover::after,.hint:focus::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}

.msg{text-align:center;color:#8A8578;font-size:15px;padding:60px 20px}
.page{display:flex;background:var(--paper);width:min(90vw,1100px);
  content-visibility:auto;contain-intrinsic-size:auto 1200px;
  margin:26px auto;box-shadow:0 2px 18px rgba(0,0,0,.14);scroll-margin-top:calc(var(--bar) + 16px)}

.margin{width:58mm;flex:0 0 58mm;border-left:1px solid var(--rule);
  padding:15mm 7mm 12mm;background:#FAF8F1}
.key{
  position:sticky;top:calc(var(--bar) + 14px);
  max-height:calc(100vh - var(--bar) - 42px);
  overflow-y:auto;scroll-behavior:smooth;
  scrollbar-width:none;-ms-overflow-style:none;
}
.key::-webkit-scrollbar{display:none}
.margin-head{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);
  font-weight:600;border-bottom:1px solid var(--rule);padding-bottom:6px;margin-bottom:10px;
  position:sticky;top:0;background:#FAF8F1;z-index:2}
.margin-head span{display:block;color:#9A958A;letter-spacing:.07em;font-weight:400;margin-top:2px}
.legend{list-style:none;margin:0;padding:0 2px}
.leg{display:flex;gap:7px;padding:6px 4px;border-bottom:1px dotted var(--rule);
  cursor:default;border-radius:3px;transition:background .14s ease}
.sw{flex:0 0 10px;height:10px;margin-top:4px;border-radius:2px}
.leg-txt b{display:block;font-size:12.5px;font-weight:600;line-height:1.25}
.leg-txt i{display:block;font-family:Amiri,serif;font-style:normal;font-size:15px;
  color:#4A473F;line-height:1.3;direction:rtl}
.leg-txt em{display:block;font-style:normal;font-size:10.5px;color:#7C776B;line-height:1.35;margin-top:2px}
.leg.hit-leg{background:var(--hl)}

.sheet{flex:1;padding:15mm 12mm 15mm;display:flex;flex-direction:column;min-width:0}
.page-head{display:flex;align-items:baseline;gap:10px;font-size:11px;color:#8A8578;
  border-bottom:1px solid var(--rule);padding-bottom:8px;letter-spacing:.08em;
  position:sticky;top:var(--bar);background:var(--paper);padding-top:6px;z-index:5}
.page-head .surah-en{font-weight:600;color:#4A473F;text-transform:uppercase}
.page-head .surah-ar{font-family:Amiri,serif;font-size:17px;color:var(--gold)}
.page-head .rng{margin-left:auto}

.mushaf{font-family:"KFGQPC Hafs","Amiri Quran",Amiri,serif;font-size:var(--ar);line-height:2.7;
  word-spacing:0.08em;text-align:right;padding-top:9mm;transition:font-size .15s ease}
.bismillah{
  font-family:"KFGQPC Hafs","Amiri Quran",Amiri,serif;font-size:calc(var(--ar) * 0.9);
  text-align:center;color:var(--gold);direction:rtl;
  padding:6mm 0 5mm;border-bottom:1px solid var(--rule);margin-bottom:5mm;
  word-spacing:0.12em;line-height:2;
}
.ayah{display:inline;scroll-margin-top:calc(var(--bar) + 90px)}
.ayah-num{font-family:Amiri,serif;font-size:.6em;color:var(--gold);
  border:1px solid var(--gold);border-radius:50%;display:inline-block;
  width:1.7em;height:1.7em;line-height:1.6em;text-align:center;
  margin:0 .2em;vertical-align:.15em}
.ayah.pinged .ayah-num{background:var(--hl)}

/* word by word transliteration, only when the toggle is on */
.w{display:inline}
.wt{display:none}
body.show-tl .mushaf{text-align:right;line-height:1.6}
body.show-tl .ayah{display:block;margin-bottom:2em}
body.show-tl .w{
  display:inline-flex;flex-direction:column;align-items:center;
  vertical-align:top;margin:0 .22em 1.5em;
}
body.show-tl .wt{
  display:block;direction:ltr;
  font-family:"Work Sans",system-ui,sans-serif;
  font-size:calc(var(--ar) * 0.42);line-height:1.35;
  color:#8A8478;margin-top:calc(var(--ar) * 0.34);white-space:nowrap;
}

.r-madd_6{color:#D40D0D}
.r-madd_muttasil{color:#F2700A}
.r-madd_munfasil{color:#D9A106}
.r-madd_246{color:#A87908}
.r-madd_2{color:#4A4740}
.r-ghunnah{color:#00A15E}
.r-idghaam_ghunnah{color:#00A9A0}
.r-idghaam_no_ghunnah{color:#6D6AE0}
.r-idghaam_shafawi{color:#A32EDB}
.r-idghaam_mutajanisayn{color:#A32EDB}
.r-idghaam_mutaqaribayn{color:#A32EDB}
.r-ikhfa{color:#0090C8}
.r-ikhfa_shafawi{color:#47B6E0}
.r-iqlab{color:#E01FA8}
.r-qalqalah{color:#0A2FD6}
.r-hamzat_wasl{color:#8E959B}
.r-lam_shamsiyyah{color:#8E959B}
.r-silent{color:#B9BFC4}

/* toggles */
body.hide-madd2 .r-madd_2{color:inherit}
body.hide-madd2 .leg[data-rule="madd_2"]{display:none}
body.plain .mushaf span[class^="r-"]{color:inherit}
body.plain .legend{opacity:.25}

@media print{
  body{background:#fff}
  .bar{display:none}
  .page{margin:0;box-shadow:none;page-break-after:always;width:auto}
  .page-head,.margin-head,.legend{position:static}
  @page{size:A4 portrait;margin:0}
}
</style>

const SURAH_NAMES = {"1": "Al-Fatihah", "2": "Al-Baqarah", "3": "Ali 'Imran", "4": "An-Nisa", "5": "Al-Ma'idah", "6": "Al-An'am", "7": "Al-A'raf", "8": "Al-Anfal", "9": "At-Tawbah", "10": "Yunus", "11": "Hud", "12": "Yusuf", "13": "Ar-Ra'd", "14": "Ibrahim", "15": "Al-Hijr", "16": "An-Nahl", "17": "Al-Isra", "18": "Al-Kahf", "19": "Maryam", "20": "Taha", "21": "Al-Anbya", "22": "Al-Hajj", "23": "Al-Mu'minun", "24": "An-Nur", "25": "Al-Furqan", "26": "Ash-Shu'ara", "27": "An-Naml", "28": "Al-Qasas", "29": "Al-'Ankabut", "30": "Ar-Rum", "31": "Luqman", "32": "As-Sajdah", "33": "Al-Ahzab", "34": "Saba", "35": "Fatir", "36": "Ya-Sin", "37": "As-Saffat", "38": "Sad", "39": "Az-Zumar", "40": "Ghafir", "41": "Fussilat", "42": "Ash-Shuraa", "43": "Az-Zukhruf", "44": "Ad-Dukhan", "45": "Al-Jathiyah", "46": "Al-Ahqaf", "47": "Muhammad", "48": "Al-Fath", "49": "Al-Hujurat", "50": "Qaf", "51": "Adh-Dhariyat", "52": "At-Tur", "53": "An-Najm", "54": "Al-Qamar", "55": "Ar-Rahman", "56": "Al-Waqi'ah", "57": "Al-Hadid", "58": "Al-Mujadila", "59": "Al-Hashr", "60": "Al-Mumtahanah", "61": "As-Saf", "62": "Al-Jumu'ah", "63": "Al-Munafiqun", "64": "At-Taghabun", "65": "At-Talaq", "66": "At-Tahrim", "67": "Al-Mulk", "68": "Al-Qalam", "69": "Al-Haqqah", "70": "Al-Ma'arij", "71": "Nuh", "72": "Al-Jinn", "73": "Al-Muzzammil", "74": "Al-Muddaththir", "75": "Al-Qiyamah", "76": "Al-Insan", "77": "Al-Mursalat", "78": "An-Naba", "79": "An-Nazi'at", "80": "'Abasa", "81": "At-Takwir", "82": "Al-Infitar", "83": "Al-Mutaffifin", "84": "Al-Inshiqaq", "85": "Al-Buruj", "86": "At-Tariq", "87": "Al-A'la", "88": "Al-Ghashiyah", "89": "Al-Fajr", "90": "Al-Balad", "91": "Ash-Shams", "92": "Al-Layl", "93": "Ad-Duhaa", "94": "Ash-Sharh", "95": "At-Tin", "96": "Al-'Alaq", "97": "Al-Qadr", "98": "Al-Bayyinah", "99": "Az-Zalzalah", "100": "Al-'Adiyat", "101": "Al-Qari'ah", "102": "At-Takathur", "103": "Al-'Asr", "104": "Al-Humazah", "105": "Al-Fil", "106": "Quraysh", "107": "Al-Ma'un", "108": "Al-Kawthar", "109": "Al-Kafirun", "110": "An-Nasr", "111": "Al-Masad", "112": "Al-Ikhlas", "113": "Al-Falaq", "114": "An-Nas"};
// remembers settings and place. falls back to a cookie, then to nothing
const store = {
  key: 'tajweed-reader',
  read() {
    try {
      const v = localStorage.getItem(this.key);
      if (v) return JSON.parse(v);
    } catch (e) {}
    try {
      const hit = document.cookie.split(';')
        .map(c => c.trim())
        .find(c => c.indexOf(this.key + '=') === 0);
      if (hit) return JSON.parse(decodeURIComponent(hit.slice(this.key.length + 1)));
    } catch (e) {}
    return null;
  },
  write(o) {
    const v = JSON.stringify(o);
    try { localStorage.setItem(this.key, v); return; } catch (e) {}
    try {
      document.cookie = this.key + '=' + encodeURIComponent(v) +
        ';path=/;max-age=' + (60 * 60 * 24 * 365) + ';SameSite=Lax';
    } catch (e) {}
  }
};
let state = store.read() || {};
let saveTimer = null;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.write(state), 400);
}

const selS = document.getElementById('sel-surah');
const selA = document.getElementById('sel-ayah');
const here = document.getElementById('here');
let syncing = false;

document.getElementById('t-madd2').addEventListener('change', e => {
  b.classList.toggle('hide-madd2', !e.target.checked);
  state.madd2 = e.target.checked; save();
});
document.getElementById('t-plain').addEventListener('change', e => {
  b.classList.toggle('plain', e.target.checked);
  state.plain = e.target.checked; save();
});
document.getElementById('t-tl').addEventListener('change', e => {
  b.classList.toggle('show-tl', e.target.checked);
  state.tl = e.target.checked; save();
});
document.getElementById('t-hover').addEventListener('change', e => {
  b.classList.toggle('no-hover', !e.target.checked);
  state.hover = e.target.checked; save();
  if (!e.target.checked) document.querySelectorAll('.hit-leg')
    .forEach(n => n.classList.remove('hit-leg'));
});
document.getElementById('sel-size').addEventListener('change', e => {
  document.documentElement.style.setProperty('--scale', e.target.value);
  state.scale = e.target.value; save();
});

// fill the ayah list for a surah, keeping the chosen one if it still exists
function fillAyahs(sid, keep) {
  const n = AYAH_COUNTS[sid] || 0;
  const want = keep && keep <= n ? keep : 1;
  selA.innerHTML = '';
  for (let i = 1; i <= n; i++) {
    const o = document.createElement('option');
    o.value = i;
    o.textContent = 'Ayah ' + i;
    selA.appendChild(o);
  }
  selA.value = want;
}

function goTo(sid, ayah, smooth) {
  const el = document.getElementById('a' + sid + '-' + ayah);
  if (!el) return;
  syncing = true;
  el.scrollIntoView({ behavior: smooth === false ? 'auto' : 'smooth', block: 'center' });
  el.classList.add('pinged');
  setTimeout(() => el.classList.remove('pinged'), 1400);
  setTimeout(() => { syncing = false; }, 700);
}

selS.addEventListener('change', () => {
  const sid = +selS.value;
  fillAyahs(sid, 1);
  state.s = sid; state.a = 1; save();
  window.scrollTo(0, 0);
  loadSurah(sid, 1);
});
selA.addEventListener('change', () => goTo(+selS.value, +selA.value));

const view = document.getElementById('view');
const msg = document.getElementById('msg');
const cache = new Map();

// shared across all loaded pages so scrolling through multiple surahs works
let io = null;
const seen = new Map();

let lastLoadedSid = 0;
let firstLoadedSid = 0;
let loadingNext = false;
let loadingPrev = false;

// Prepend a Bismillah header to every surah except 1 (it is ayah 1 there)
// and 9 (At-Tawbah, which traditionally has no Bismillah).
function addBismillah(page) {
  const sid = +page.dataset.s;
  if (sid === 1 || sid === 9) return;
  const mushaf = page.querySelector('.mushaf');
  if (!mushaf) return;
  const el = document.createElement('div');
  el.className = 'bismillah';
  el.textContent = 'بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ';
  mushaf.prepend(el);
}

// Fix combining marks that were wrapped in their own <span> by the build script,
// which breaks the browser's Arabic shaping engine and misplaces diacritics.
// Moves the preceding base character into the span so base+marks share one box.
function fixCombiningMarks(page) {
  const isCombining = c => {
    const cp = c.charCodeAt(0);
    return (cp >= 0x064B && cp <= 0x065F) || cp === 0x0670
        || (cp >= 0x06D6 && cp <= 0x06DC) || (cp >= 0x06DF && cp <= 0x06E4)
        || (cp >= 0x06E7 && cp <= 0x06E8);
  };
  page.querySelectorAll('.wa [class^="r-"]').forEach(span => {
    if (!span.textContent || !isCombining(span.textContent[0])) return;
    const prev = span.previousSibling;
    if (!prev || prev.nodeType !== Node.TEXT_NODE || !prev.textContent) return;
    const s = prev.textContent;
    // Scan back past any trailing combining marks to find the base character.
    let pos = s.length - 1;
    while (pos > 0 && isCombining(s[pos])) pos--;
    // pos is now the base character index; move it and everything after into the span.
    span.prepend(s.slice(pos));
    prev.textContent = s.slice(0, pos);
  });
}

// fires when the bottom sentinel of a page nears the viewport — loads next surah
const bottomIO = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting || loadingNext || lastLoadedSid >= 114) return;
    bottomIO.unobserve(e.target);
    appendSurah(lastLoadedSid + 1);
  });
}, { rootMargin: '0px 0px 800px 0px' });

// fires when the top sentinel of a page nears the viewport — loads previous surah
const topIO = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (!e.isIntersecting || loadingPrev || firstLoadedSid <= 1) return;
    topIO.unobserve(e.target);
    prependSurah(firstLoadedSid - 1);
  });
}, { rootMargin: '800px 0px 0px 0px' });

function wire(page) {
  addBismillah(page);
  fixCombiningMarks(page);
  const m = page.querySelector('.mushaf');
  const clear = () => page.querySelectorAll('.hit-leg')
                          .forEach(n => n.classList.remove('hit-leg'));
  m.addEventListener('mouseover', e => {
    if (b.classList.contains('no-hover')) return;
    const t = e.target.closest('[data-rule]');
    clear();
    if (!t) return;
    const leg = page.querySelector('.leg[data-rule="' + t.dataset.rule + '"]');
    if (!leg) return;
    leg.classList.add('hit-leg');
    const key = page.querySelector('.key');
    const kb = key.getBoundingClientRect(), lb = leg.getBoundingClientRect();
    if (lb.top < kb.top + 28) key.scrollTop -= (kb.top + 28 - lb.top);
    else if (lb.bottom > kb.bottom - 6) key.scrollTop += (lb.bottom - kb.bottom + 6);
  });
  m.addEventListener('mouseleave', clear);

  // one persistent IO shared across all pages — keeps dropdowns in sync while scrolling
  if (!io) {
    io = new IntersectionObserver(entries => {
      entries.forEach(e => seen.set(e.target, e.isIntersecting ? e.intersectionRatio : 0));
      let best = null, bestR = 0;
      seen.forEach((r, el) => { if (r > bestR) { bestR = r; best = el; } });
      if (!best || syncing) return;
      const sid = +best.dataset.s, ayah = +best.dataset.a;
      if (+selS.value !== sid) { selS.value = sid; fillAyahs(sid, ayah); }
      else { selA.value = ayah; }
      state.s = sid; state.a = ayah; save();
      here.textContent = (SURAH_NAMES[sid] || '') + '  ' + sid + ':' + ayah;
    }, { rootMargin: '-25% 0px -55% 0px', threshold: [0, .25, .5, 1] });
  }
  page.querySelectorAll('.ayah').forEach(a => io.observe(a));

  // sentinel at the top of this page triggers loading the previous surah
  const topSentinel = document.createElement('div');
  page.prepend(topSentinel);
  topIO.observe(topSentinel);

  // sentinel at the bottom of this page triggers loading the next surah
  const sentinel = document.createElement('div');
  page.appendChild(sentinel);
  bottomIO.observe(sentinel);
}

async function fetchSurah(sid) {
  if (cache.has(sid)) return cache.get(sid);
  const r = await fetch('surahs/' + sid + '.html');
  if (!r.ok) throw new Error(r.status);
  const html = await r.text();
  cache.set(sid, html);
  return html;
}

async function appendSurah(sid) {
  if (loadingNext || sid < 1 || sid > 114) return;
  loadingNext = true;
  try {
    const html = await fetchSurah(sid);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const page = tmp.querySelector('.page');
    if (page) { view.appendChild(page); lastLoadedSid = sid; wire(page); }
  } catch (e) {
    // silent — user can still navigate via dropdown
  } finally {
    loadingNext = false;
  }
}

async function prependSurah(sid) {
  if (loadingPrev || sid < 1 || sid > 114) return;
  loadingPrev = true;
  try {
    const html = await fetchSurah(sid);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const page = tmp.querySelector('.page');
    if (!page) return;
    // anchor scroll so the existing content doesn't jump
    const anchor = view.firstElementChild;
    const anchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
    view.prepend(page);
    firstLoadedSid = sid;
    const newAnchorTop = anchor ? anchor.getBoundingClientRect().top : 0;
    window.scrollBy(0, newAnchorTop - anchorTop);
    wire(page);
  } catch (e) {
    // silent
  } finally {
    loadingPrev = false;
  }
}

async function loadSurah(sid, ayah) {
  // reset view and observers for explicit navigation
  view.innerHTML = '';
  if (io) { io.disconnect(); io = null; }
  seen.clear();
  lastLoadedSid = 0;
  firstLoadedSid = 0;
  loadingNext = false;
  loadingPrev = false;

  msg.textContent = 'Loading surah ' + sid + '…';
  msg.style.display = 'block';
  try {
    const html = await fetchSurah(sid);
    const tmp = document.createElement('div');
    tmp.innerHTML = html;
    const page = tmp.querySelector('.page');
    if (!page) return;
    view.appendChild(page);
    lastLoadedSid = sid;
    firstLoadedSid = sid;
    msg.style.display = 'none';
    wire(page);
    if (ayah) goTo(sid, ayah, false);
  } catch (e) {
    msg.textContent = 'Could not load surah ' + sid +
      '. Open this page over http, not as a local file.';
  }
}

function restore() {
  const set = (id, on) => {
    const el = document.getElementById(id);
    if (el.checked !== on) { el.checked = on; el.dispatchEvent(new Event('change')); }
  };
  if (state.madd2 === false) set('t-madd2', false);
  if (state.plain === true) set('t-plain', true);
  if (state.tl === true) set('t-tl', true);
  if (state.hover === false) set('t-hover', false);
  const sizeEl = document.getElementById('sel-size');
  if (state.scale) {
    sizeEl.value = state.scale;
    document.documentElement.style.setProperty('--scale', state.scale);
  } else if (window.matchMedia('(max-width: 600px)').matches) {
    sizeEl.value = '1.5';
    document.documentElement.style.setProperty('--scale', '1.5');
  }
  const sid = state.s && AYAH_COUNTS[state.s] ? state.s : +selS.value;
  const ayah = state.s === sid && state.a ? state.a : 1;
  selS.value = sid;
  fillAyahs(sid, ayah);
  loadSurah(sid, ayah);
}

if (document.fonts && document.fonts.ready) document.fonts.ready.then(restore);
else window.addEventListener('load', restore);
